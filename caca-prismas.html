<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Caça-Prismas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Um mundo de blocos visto de dentro: interface de vidro escuro sobre o céu; o ouro dos prismas é o único destaque, e cada raridade tem sua cor. */
:root {
  --vidro: rgba(14, 18, 34, 0.74);
  --vidro-forte: rgba(10, 13, 26, 0.92);
  --borda: rgba(255, 255, 255, 0.14);
  --tinta: #f3f6ff;
  --tinta-2: #b9c3e0;
  --ouro: #ffd84a;
  --vida: #ff4d6d;
  --f-titulo: 'Bungee', 'Arial Black', Impact, sans-serif;
  --f-texto: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --slot: 52px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: #0c1222; color: var(--tinta); font-family: var(--f-texto); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--f-texto); color: var(--tinta); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.ui { position: fixed; z-index: 5; }
.vidro { background: var(--vidro); border: 1px solid var(--borda); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* canto esquerdo: pontos + vida */
#esq { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(280px, 52vw); }
#pontos { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; position: relative; width: max-content; max-width: 100%; }
#pontos svg { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 0 6px rgba(255, 200, 40, 0.8)); }
#pontos .n { font-family: var(--f-titulo); font-size: 19px; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#pontos .l { font-size: 10px; color: var(--tinta-2); font-weight: 800; letter-spacing: 0.08em; }
#ganho { position: absolute; left: 100%; top: 50%; margin-left: 10px; transform: translateY(-50%); white-space: nowrap; font-family: var(--f-titulo); font-size: 16px; pointer-events: none; opacity: 0; }
#ganho.on { animation: ganhoEntra 0.35s cubic-bezier(.2, 1.6, .4, 1) forwards; }
#ganho.sai { animation: ganhoSai 0.6s ease-in forwards; }
#ganho span { display: inline-block; background: linear-gradient(100deg, #fff6c2 0%, #ffd84a 30%, #ff9d1c 50%, #ffd84a 70%, #fff6c2 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brilho 1.1s linear infinite; filter: drop-shadow(0 0 5px rgba(255, 196, 40, 0.85)) drop-shadow(0 1px 0 rgba(0, 0, 0, 0.6)); }
#ganho.pulso span { animation: brilho 1.1s linear infinite, pulso 0.28s ease-out; }
@keyframes brilho { to { background-position: -220% 0; } }
@keyframes pulso { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes ganhoEntra { from { opacity: 0; transform: translate(-8px, -50%) scale(0.7); } to { opacity: 1; transform: translate(0, -50%) scale(1); } }
@keyframes ganhoSai { from { opacity: 1; transform: translate(0, -50%); } to { opacity: 0; transform: translate(6px, -120%); } }
#vida { padding: 7px 10px; }
#vida .barra { height: 13px; border-radius: 7px; background: rgba(255, 255, 255, 0.1); overflow: hidden; position: relative; }
#vida .barra i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff2e63, #ff6b8a); border-radius: 7px; }
#vida .barra b { position: absolute; inset: 0; font: 800 10px/13px var(--f-texto); text-align: center; text-shadow: 0 1px 2px #000; white-space: nowrap; }
#vida .zona { font-size: 12px; font-weight: 800; color: var(--tinta-2); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 8px; }
#vida .zona span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#vida .zona b { color: var(--tinta); white-space: nowrap; }

/* topo direito */
#topo { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.bt { border: 1px solid var(--borda); background: var(--vidro); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 13px; position: relative; white-space: nowrap; }
.bt:hover { background: var(--vidro-forte); }
.bt .badge { position: absolute; top: -6px; right: -6px; background: var(--ouro); color: #2a1c00; font: 11px/18px var(--f-titulo); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; box-shadow: 0 0 10px rgba(255, 216, 74, 0.8); }
#radar { top: calc(62px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: 128px; height: 128px; border-radius: 50%; border: 2px solid var(--borda); background: rgba(10, 14, 28, 0.55); }
#dist { top: calc(194px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: 128px; text-align: center; font-size: 11px; font-weight: 800; color: var(--tinta-2); text-shadow: 0 1px 2px #000; }

/* banner, chefe, avisos */
#banner { top: 24%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s; width: 90vw; }
#banner.on { opacity: 1; }
#banner h2 { margin: 0; font: 400 clamp(22px, 5vw, 40px)/1.05 var(--f-titulo); letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 0 22px rgba(0, 0, 0, 0.4); text-wrap: balance; }
#banner p { margin: 6px 0 0; font-weight: 800; font-size: 14px; text-shadow: 0 1px 3px #000; }
#chefe { top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, 50vw); text-align: center; }
#chefe .nome { font: 400 13px var(--f-titulo); letter-spacing: 0.5px; text-shadow: 0 2px 0 #000; color: #ffe1a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chefe .barra { margin-top: 4px; height: 12px; border-radius: 3px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.25); overflow: hidden; }
#chefe .barra i { display: block; height: 100%; background: linear-gradient(90deg, #ff3d3d, #ff9d1c); }
#aviso { left: 50%; top: 33%; transform: translateX(-50%); font-weight: 800; font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; text-align: center; width: 86vw; }
#toasts { left: 50%; bottom: calc(var(--slot) + 44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { padding: 7px 12px; border-radius: 10px; background: var(--vidro-forte); border: 1px solid var(--borda); font-weight: 800; font-size: 13px; animation: toast 3s ease forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* barra de itens */
#barra { left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 5px; padding: 5px; border-radius: 14px; background: rgba(10, 13, 26, 0.6); border: 1px solid var(--borda); backdrop-filter: blur(6px); }
.slot { width: var(--slot); height: var(--slot); border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.05); position: relative; padding: 0; display: grid; place-items: center; }
.slot svg { width: 70%; height: 70%; }
.slot .k { position: absolute; left: 4px; top: 2px; font: 800 9px var(--f-texto); color: var(--tinta-2); }
.slot .q { position: absolute; right: 4px; bottom: 1px; font: 400 11px var(--f-titulo); text-shadow: 0 1px 2px #000; }
.slot.sel { border-color: var(--ouro); background: rgba(255, 216, 74, 0.14); box-shadow: 0 0 12px rgba(255, 216, 74, 0.45); transform: translateY(-3px); }
#menuBau { z-index: 8; bottom: calc(var(--slot) + 30px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
#menuBau p { margin: 0 0 4px; font-weight: 800; font-size: 13px; text-align: center; }
#menuBau button { border: 1px solid var(--borda); background: rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 9px; font-weight: 800; }
#menuBau button.pri2 { background: linear-gradient(180deg, #ffe680, #ffc23a); color: #2a1c00; border: 0; }

/* ações (toque) */
#acoes { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(var(--slot) + 34px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 58px 78px; grid-template-rows: 58px 78px; gap: 10px; align-items: end; justify-items: end; }
#acoes button { width: 58px; height: 58px; border-radius: 18px; border: 1px solid var(--borda); background: var(--vidro); backdrop-filter: blur(6px); font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; touch-action: none; }
#acoes button svg { width: 26px; height: 26px; }
#acoes #bAcao { grid-column: 2; grid-row: 2; width: 78px; height: 78px; border-radius: 24px; border: 2px solid rgba(255, 216, 74, 0.5); }
#acoes #bAcao svg { width: 38px; height: 38px; }
#acoes #bAcao.recarga { opacity: 0.55; }
#bPulo { grid-column: 2; grid-row: 1; }
#bLobby { grid-column: 1; grid-row: 2; }
#joy { position: fixed; z-index: 4; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(10, 14, 28, 0.25); pointer-events: none; display: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
#dica { left: 50%; bottom: calc(var(--slot) + 30px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--tinta-2); text-shadow: 0 1px 2px #000; text-align: center; pointer-events: none; width: min(720px, 80vw); transition: opacity 1s; }
body.toque #dica { display: none; }
body:not(.toque) #acoes { display: none; }

/* textos no mundo */
#rotulos { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.dn { position: absolute; font: 400 14px var(--f-titulo); color: #fff; text-shadow: 0 0 3px #000, 0 2px 0 #000; transform: translate(-50%, -50%); white-space: nowrap; }
.dn.crit { color: #ffe36a; font-size: 17px; }
.dn.dor { color: #ff6b7d; }
.hpm { position: absolute; width: 44px; height: 6px; margin-left: -22px; background: rgba(0, 0, 0, 0.55); border-radius: 3px; overflow: hidden; }
.hpm i { display: block; height: 100%; background: #ff4d6d; }
#dor { position: fixed; inset: 0; pointer-events: none; z-index: 2; box-shadow: inset 0 0 120px rgba(255, 30, 60, 0.75); opacity: 0; transition: opacity 0.25s; }

/* painéis */
.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 8, 18, 0.45); }
.painel { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--vidro-forte); border: 1px solid var(--borda); border-radius: 18px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); box-sizing: border-box; }
.painel.largo { width: min(860px, 100%); }
.painel h3 { margin: 0; font: 400 20px var(--f-titulo); letter-spacing: 0.5px; }
.painel h4 { margin: 14px 0 8px; font-size: 13px; color: var(--tinta-2); letter-spacing: 0.06em; }
.painel .cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.fechar { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--borda); border-radius: 10px; width: 36px; height: 36px; font-size: 18px; font-weight: 800; flex: none; }
.sub { color: var(--tinta-2); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
.disp { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 216, 74, 0.1); border: 1px solid rgba(255, 216, 74, 0.35); flex-wrap: wrap; }
.disp b { font: 400 20px var(--f-titulo); color: var(--ouro); font-variant-numeric: tabular-nums; }
.attr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.attr .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.attr .ic svg { width: 24px; height: 24px; }
.attr .nm { font-weight: 800; font-size: 15px; }
.attr .nm small { font: 400 14px var(--f-titulo); margin-left: 6px; font-variant-numeric: tabular-nums; }
.attr .ef { font-size: 12px; color: var(--tinta-2); }
.bts { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.bts button, .mini { border: 1px solid var(--borda); background: rgba(255, 255, 255, 0.07); border-radius: 9px; padding: 6px 9px; font-weight: 800; font-size: 12px; min-width: 40px; }
.bts button:disabled, .mini:disabled { opacity: 0.35; cursor: default; }
.bts button:not(:disabled):hover, .mini:not(:disabled):hover { background: rgba(255, 216, 74, 0.2); }
.mini.perigo { border-color: rgba(255, 77, 109, 0.6); color: #ffc2cc; }

/* inventário */
.inv-topo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inv-topo .cap { font: 400 15px var(--f-titulo); margin-right: auto; }
.equip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.eq { border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 8px; display: flex; gap: 8px; align-items: center; min-height: 44px; background: rgba(255, 255, 255, 0.03); text-align: left; font-size: 11px; font-weight: 800; color: var(--tinta-2); min-width: 0; }
.eq svg { width: 30px; height: 30px; flex: none; }
.eq span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 12px; color: var(--tinta-2); margin-top: 8px; }
.stats b { color: var(--tinta); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }
.grade .slot { width: 100%; height: auto; aspect-ratio: 1; }
.grade .slot.vazio { border-style: dashed; opacity: 0.4; }
.detalhe { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--borda); }
.detalhe .nm { font-weight: 800; font-size: 15px; }
.detalhe ul { margin: 6px 0 10px; padding-left: 18px; font-size: 13px; color: var(--tinta-2); }
.detalhe ul b { color: var(--tinta); }
.melhor { color: #6dff9a !important; } .pior { color: #ff8a9a !important; }
.confirma { margin-top: 8px; padding: 10px; border-radius: 10px; background: rgba(255, 77, 109, 0.12); border: 1px solid rgba(255, 77, 109, 0.4); font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.premios { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.premio { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; border: 2px solid; background: rgba(255, 255, 255, 0.04); opacity: 0; animation: revela 0.4s cubic-bezier(.2, 1.4, .4, 1) forwards; min-width: 0; }
.premio svg { width: 34px; height: 34px; flex: none; }
.premio div { font-size: 12px; font-weight: 800; min-width: 0; }
.premio small { display: block; font-weight: 700; opacity: 0.8; }
@keyframes revela { from { opacity: 0; transform: scale(0.6) translateY(10px); } to { opacity: 1; transform: none; } }

/* criador */
#criador { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 32px)); overflow: auto; }
#criador .painel { width: 100%; max-height: none; }
.op { margin-top: 12px; }
.op > span { display: block; font-weight: 800; font-size: 12px; color: var(--tinta-2); margin-bottom: 6px; letter-spacing: 0.04em; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { border: 2px solid transparent; background: rgba(255, 255, 255, 0.07); border-radius: 10px; min-width: 34px; height: 34px; padding: 0 9px; font-weight: 800; font-size: 12px; }
.sw button.cor { width: 34px; padding: 0; }
.sw button.on { border-color: var(--ouro); box-shadow: 0 0 10px rgba(255, 216, 74, 0.5); }
.campo { width: 100%; box-sizing: border-box; border: 1px solid var(--borda); background: rgba(255, 255, 255, 0.06); border-radius: 10px; color: var(--tinta); font: 700 15px var(--f-texto); padding: 10px 12px; }
.pri { width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 13px; font: 400 16px var(--f-titulo); color: #2a1c00; background: linear-gradient(180deg, #ffe680, #ffc23a); box-shadow: 0 4px 0 #b37a00, 0 0 18px rgba(255, 200, 40, 0.45); letter-spacing: 0.5px; }
.pri:active { transform: translateY(2px); box-shadow: 0 2px 0 #b37a00; }
.titulo-jogo { font: 400 clamp(26px, 6vw, 34px)/1 var(--f-titulo); margin: 0 0 4px; background: linear-gradient(180deg, #fff, #ffe48a 60%, #ffb020); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5)); }
#morte { z-index: 15; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(40, 0, 10, 0.45); }
#morte h2 { font: 400 34px var(--f-titulo); margin: 0; text-shadow: 0 3px 0 #000; }
#morte p { font-weight: 800; }
#fps { left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font: 700 11px var(--f-texto); color: var(--tinta-2); text-shadow: 0 1px 2px #000; white-space: nowrap; }
.tecla { display: inline-block; padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--borda); font-size: 11px; font-weight: 800; }
@media (max-width: 640px) {
  :root { --slot: 38px; }
  #barra { gap: 4px; padding: 4px; }
  #topo .bt span.txt { display: none; }
  #radar { width: 96px; height: 96px; top: calc(60px + env(safe-area-inset-top, 0px)); }
  #dist { width: 96px; top: calc(160px + env(safe-area-inset-top, 0px)); }
  #criador { top: auto; height: 52%; left: max(16px, env(safe-area-inset-left, 0px)); width: auto; }
  #chefe { top: calc(180px + env(safe-area-inset-top, 0px)); width: 70vw; }
  .equip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #banner { top: 27%; }
}
body.toque #toasts { bottom: auto; top: calc(205px + env(safe-area-inset-top, 0px)); }

/* ===== mega atualização ===== */
.dn.el { font-size: 15px; }
.dn.ref { color: #e0f0ff; font-size: 12px; }
#buffs { display: flex; flex-wrap: wrap; gap: 4px; }
.bf { display: flex; align-items: center; gap: 5px; padding: 3px 7px 3px 5px; border-radius: 8px; background: var(--vidro-forte); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); font: 800 10px var(--f-texto); white-space: nowrap; position: relative; overflow: hidden; }
.bf i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); box-shadow: 0 0 6px var(--c); transform: rotate(45deg); }
.bf u { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--c); text-decoration: none; }
#coleta { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(240px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; }
#dica { bottom: calc(var(--slot) + 84px + env(safe-area-inset-bottom, 0px)); }
.hpm.elite i { background: #c080ff; } .hpm.elite { width: 56px; margin-left: -28px; height: 7px; box-shadow: 0 0 0 1px #c080ff; }
.col { flex-direction: row-reverse; border-left: 0; border-right: 3px solid var(--c); padding: 3px 4px 3px 9px; display: flex; align-items: center; gap: 6px; font: 800 11px var(--f-texto); padding: 3px 9px 3px 4px; border-radius: 8px; background: rgba(10, 13, 26, 0.7); text-shadow: 0 1px 2px #000; animation: colEntra 0.3s ease-out; white-space: nowrap; max-width: 56vw; overflow: hidden; text-overflow: ellipsis; }
.col svg { width: 16px; height: 16px; flex: none; }
.col.pulso svg { animation: pulso 0.3s ease-out; }
.col.sai { opacity: 0; transform: translateX(-10px); transition: 0.4s; }
@keyframes colEntra { from { opacity: 0; transform: translateX(-12px); } }
.slot { --c: rgba(255, 255, 255, 0.12); border-color: color-mix(in srgb, var(--c) 65%, transparent); }

    const bks = BK.map((k) => { try { const t = localStorage.getItem(k); const d = t && JSON.parse(t); return d && d.quando ? d : null; } catch (e) { return null; } }).filter(Boolean).sort((a, b) => b.quando - a.quando);
    for (const b of bks) { n = lerSave(b.save); if (n) { saveOrigem = 'copia'; break; } }
  }

    try { const bruto = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (bruto && (bruto.versao || 2) < VERSAO_SAVE) localStorage.setItem('cacaprismas:antes-v' + VERSAO_SAVE, JSON.stringify(bruto)); } catch (e) { /* ok */ }

function salvarCopia() { try { const i = Math.floor(Date.now() / 300000) % BK.length; localStorage.setItem(BK[i], JSON.stringify({ quando: Date.now(), save: JSON.parse(dadosSave()) })); } catch (e) { /* ok */ } }
